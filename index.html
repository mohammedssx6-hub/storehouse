<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المستودعات والمخزون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f6f9; --card: #fff; --primary: #4a6fa5; --primary-dark: #3b5a85;
      --text: #2c3e50; --muted: #7f8c9a; --border: #e1e6ed;
      --success: #27ae60; --danger: #e74c3c; --warning: #f39c12;
      --shadow: 0 2px 8px rgba(0,0,0,.06); --radius: 12px;
    }
    body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); direction: rtl; }
    .hidden { display: none !important; }

    /* ==== Login ==== */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #e8eef7, #d4dfef); padding: 20px;
    }
    .login-card {
      background: var(--card); padding: 40px; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.1); text-align: center; max-width: 400px; width: 100%;
    }
    .login-card .logo { font-size: 56px; margin-bottom: 12px; }
    .login-card h1 { margin-bottom: 8px; color: var(--primary); }
    .login-card p { color: var(--muted); margin-bottom: 24px; }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px; border: 1px solid var(--border);
      background: #fff; border-radius: 10px; font-family: inherit;
      font-size: 15px; cursor: pointer; transition: .2s; margin-bottom: 16px;
    }
    .btn-google:hover { background: #f8f9fb; }
    .btn-google:disabled { opacity: .6; cursor: not-allowed; }
    
    .divider { display: flex; align-items: center; margin: 20px 0; color: var(--muted); font-size: 14px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider span { padding: 0 10px; }

    .email-form .form-group { margin-bottom: 12px; text-align: right; }
    .email-form label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
    .email-form .form-control {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 14px; background: #fafbfd;
    }
    .email-form .form-control:focus { outline: none; border-color: var(--primary); background: #fff; }
    
    .btn-email {
      width: 100%; padding: 12px; background: var(--primary); color: #fff;
      border: none; border-radius: 10px; font-family: inherit; font-size: 15px; cursor: pointer;
      margin-top: 8px;
    }
    .btn-email:hover { background: var(--primary-dark); }
    .btn-email:disabled { opacity: .6; cursor: not-allowed; }
    .btn-email.secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); margin-top: 8px; }
    .btn-email.secondary:hover { background: #eef2f8; }

    /* ==== App Layout ==== */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 250px; background: var(--card); border-left: 1px solid var(--border);
      padding: 20px; display: flex; flex-direction: column; gap: 20px;
      position: sticky; top: 0; height: 100vh; flex-shrink: 0;
    }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-link {
      padding: 12px 14px; border-radius: 8px; color: var(--text);
      text-decoration: none; font-size: 15px; transition: .2s; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-link:hover { background: #eef2f8; }
    .nav-link.active { background: var(--primary); color: #fff; }
    .user-box { display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border); }
    .user-box img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eef2f8; }
    .user-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
    .btn-link { background: none; border: none; color: var(--danger); cursor: pointer; font-family: inherit; font-size: 13px; padding: 0; }

    .main { flex: 1; padding: 20px; min-width: 0; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .menu-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
    .topbar h2 { font-size: 22px; color: var(--primary); }

    /* ==== Pages ==== */
    .page { display: none; }
    .page.active { display: block; }

    /* ==== Cards & Stats ==== */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); border-right: 4px solid var(--primary); }
    .stat-card .label { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); }

    .section-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
    .section-card h3 { margin-bottom: 16px; color: var(--primary); font-size: 18px; }

    /* ==== Buttons ==== */
    .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; transition: .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f4f6f9; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    /* ==== Forms ==== */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
    .form-group label .req { color: var(--danger); }
    .form-group label .opt { color: var(--muted); font-size: 12px; }
    .form-control {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 14px; background: #fafbfd;
    }
    .form-control:focus { outline: none; border-color: var(--primary); background: #fff; }
    textarea.form-control { min-height: 80px; resize: vertical; }

    /* ==== Tables ==== */
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); font-size: 14px; }
    .table th { background: #f8fafc; color: var(--muted); font-weight: 600; }
    .table tr:hover td { background: #fafbfd; }

    /* ==== Warehouse Cards ==== */
    .wh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .wh-card {
      background: var(--card); padding: 20px; border-radius: var(--radius);
      box-shadow: var(--shadow); transition: .2s; border: 1px solid var(--border);
    }
    .wh-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    .wh-card .icon { font-size: 32px; margin-bottom: 8px; }
    .wh-card h4 { color: var(--primary); margin-bottom: 4px; }
    .wh-card p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

    /* ==== Toast ==== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--text); color: #fff; padding: 12px 24px; border-radius: 8px;
      font-size: 14px; opacity: 0; transition: .3s; z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.warning { background: var(--warning); }

    /* ==== Modal ==== */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
    .modal-content { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { color: var(--primary); }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }

    /* ==== Search Result Cards ==== */
    .result-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .result-card .header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .result-card .name { font-weight: 700; color: var(--primary); font-size: 16px; }
    .result-card .price { color: var(--success); font-weight: 600; }
    .result-card .wh-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .wh-badge { background: #eef2f8; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 13px; }
    .empty-state { text-align: center; padding: 40px; color: var(--muted); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    /* ==== Loader ==== */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-left: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==== Search box in dropdowns ==== */
    .searchable { position: relative; }
    .searchable-input { margin-bottom: 6px; }
    .searchable-list {
      max-height: 180px; overflow-y: auto; border: 1px solid var(--border);
      border-radius: 8px; background: #fafbfd; display: none;
    }
    .searchable-list.open { display: block; }
    .searchable-item { padding: 10px 12px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); }
    .searchable-item:last-child { border-bottom: none; }
    .searchable-item:hover { background: #eef2f8; }
    .searchable-item.selected { background: var(--primary); color: #fff; }
    .searchable-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .searchable-item.selected .meta { color: #d1dce8; }

    /* ==== Recent Logs Compact ==== */
    .recent-log { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .recent-log:last-child { border-bottom: none; }
    .recent-log .action { font-weight: 600; color: var(--primary); }
    .recent-log .time { color: var(--muted); font-size: 12px; }

    /* ==== Responsive ==== */
    @media (max-width: 900px) {
      .sidebar { position: fixed; top: 0; right: -280px; z-index: 900; transition: right .3s; width: 260px; }
      .sidebar.open { right: 0; }
      .menu-toggle { display: block; }
      .main { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- ============ Login Screen ============ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="logo">📦</div>
      <h1>إدارة المستودعات</h1>
      <p>سجّل الدخول للبدء</p>

      <button id="google-login-btn" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.4l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.5 5.5C41.4 36.1 44 30.5 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        تسجيل الدخول بـ Google
      </button>

      <div class="divider"><span>أو</span></div>

      <div class="email-form">
        <div class="form-group">
          <label for="login-email">البريد الإلكتروني</label>
          <input type="email" id="login-email" class="form-control" placeholder="example@mail.com" />
        </div>
        <div class="form-group">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" class="form-control" placeholder="********" />
        </div>
        <button id="email-login-btn" class="btn-email">تسجيل الدخول</button>
        <button id="email-signup-btn" class="btn-email secondary">إنشاء حساب جديد</button>
      </div>
    </div>
  </div>

  <!-- ============ Main App ============ -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span>📦</span> المستودعات</div>
      <nav class="nav">
        <a class="nav-link active" data-page="dashboard">🏠 الرئيسية</a>
        <a class="nav-link" data-page="warehouses">🏬 المستودعات</a>
        <a class="nav-link" data-page="search">🔍 البحث</a>
        <a class="nav-link" data-page="transfer">🔄 نقل البضاعة</a>
        <a class="nav-link" data-page="logs">📋 سجل العمليات</a>
      </nav>
      <div class="user-box">
        <img id="user-avatar" src="" alt="" />
        <div>
          <div id="user-name" class="user-name"></div>
          <button id="logout-btn" class="btn-link">تسجيل الخروج</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-toggle" class="menu-toggle">☰</button>
        <h2 id="page-title">الرئيسية</h2>
      </header>

      <section id="page-dashboard" class="page active"></section>
      <section id="page-warehouses" class="page"></section>
      <section id="page-warehouse-detail" class="page"></section>
      <section id="page-search" class="page"></section>
      <section id="page-transfer" class="page"></section>
      <section id="page-logs" class="page"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="document.getElementById('modal').classList.add('hidden')">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    // ============================================
    // Firebase Configuration
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyC2h5xglOIfzWStVSEAxaJ4iA4Nlb_mmZE",
      authDomain: "storehouse-e8a29.firebaseapp.com",
      projectId: "storehouse-e8a29",
      storageBucket: "storehouse-e8a29.firebasestorage.app",
      messagingSenderId: "129183410595",
      appId: "1:129183410595:web:52552e61c1c4aad9c5d216",
      measurementId: "G-EKWSP2HJGJ"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
             createUserWithEmailAndPassword, signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, updateDoc,
      query, orderBy, serverTimestamp, runTransaction, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;

    // ============================================
    // Helpers
    // ============================================
    const $ = (s) => document.querySelector(s);
    const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
    const fmtDate = (ts) => { if (!ts) return "-"; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString("ar-EG", { dateStyle: "short", timeStyle: "short" }); };
    const fmtMoney = (n) => {
      if (n === null || n === undefined || n === "" || Number(n) === 0) return "—";
      return Number(n).toLocaleString("ar-EG") + " ج.م";
    };

    function showToast(msg, type = "") {
      const t = $("#toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = "toast"; }, 3000);
    }
    function openModal(title, html) {
      $("#modal-title").textContent = title;
      $("#modal-body").innerHTML = html;
      $("#modal").classList.remove("hidden");
    }
    function closeModal() { $("#modal").classList.add("hidden"); }

    // Loading helper for buttons
    function setLoading(btn, isLoading, textWhenLoading = "جارٍ الحفظ...") {
      if (!btn) return;
      if (isLoading) {
        btn.disabled = true;
        btn.dataset.originalText = btn.innerHTML;
        btn.innerHTML = `<span class="spinner"></span> ${textWhenLoading}`;
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.originalText || btn.innerHTML;
      }
    }

    // ============================================
    // Firestore Data Layer
    // ============================================
    const whCol = () => collection(db, "users", currentUser.uid, "warehouses");
    const logCol = () => collection(db, "users", currentUser.uid, "logs");
    const itemsCol = (whId) => collection(db, "users", currentUser.uid, "warehouses", whId, "items");

    async function addLog(action, details) {
      await addDoc(logCol(), { action, details, createdAt: serverTimestamp() });
    }
    async function createWarehouse(name) {
      const d = await addDoc(whCol(), { name, createdAt: serverTimestamp() });
      await addLog("إضافة مستودع", `إنشاء: ${name}`);
      return d.id;
    }
    async function getWarehouses() {
      const snap = await getDocs(query(whCol(), orderBy("createdAt", "asc")));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    async function getWarehouse(id) {
      const s = await getDoc(doc(whCol(), id));
      return s.exists() ? { id: s.id, ...s.data() } : null;
    }
    async function deleteWarehouse(id, name) {
      await deleteDoc(doc(whCol(), id));
      await addLog("حذف مستودع", `حذف: ${name}`);
    }
    async function renameWarehouse(id, newName, oldName) {
      await updateDoc(doc(whCol(), id), { name: newName });
      await addLog("تعديل مستودع", `${oldName} → ${newName}`);
    }
    async function addItem(whId, whName, data) {
      await addDoc(itemsCol(whId), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      await addLog("إضافة صنف", `"${data.name}" (${data.quantity}) في ${whName}`);
    }
    async function getItems(whId) {
      const snap = await getDocs(query(itemsCol(whId), orderBy("createdAt", "desc")));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    async function deleteItem(whId, itemId, name, whName) {
      await deleteDoc(doc(itemsCol(whId), itemId));
      await addLog("حذف صنف", `"${name}" من ${whName}`);
    }
    async function updateItem(whId, itemId, data, changeDesc, itemName) {
      await updateDoc(doc(itemsCol(whId), itemId), { ...data, updatedAt: serverTimestamp() });
      await addLog("تعديل صنف", `"${itemName}": ${changeDesc}`);
    }
    async function getLogs(max = 200) {
      const snap = await getDocs(query(logCol(), orderBy("createdAt", "desc"), limit(max)));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    async function getRecentLogs(max = 5) {
      const snap = await getDocs(query(logCol(), orderBy("createdAt", "desc"), limit(max)));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function aggregateByName(term) {
      const whSnap = await getDocs(whCol());
      const map = new Map();
      for (const whDoc of whSnap.docs) {
        const wh = { id: whDoc.id, ...whDoc.data() };
        const iSnap = await getDocs(itemsCol(wh.id));
        iSnap.forEach(i => {
          const it = i.data();
          if ((it.name || "").toLowerCase().includes(term.toLowerCase())) {
            const key = it.name.trim().toLowerCase();
            if (!map.has(key)) map.set(key, { name: it.name, price: it.price, totalQty: 0, perWarehouse: [] });
            const e = map.get(key);
            e.totalQty += Number(it.quantity) || 0;
            e.perWarehouse.push({ whId: wh.id, whName: wh.name, qty: it.quantity, itemId: i.id });
          }
        });
      }
      return Array.from(map.values());
    }

    async function transferStock({ fromWhId, toWhId, itemName, qty }) {
      if (fromWhId === toWhId) throw new Error("لا يمكن النقل لنفس المستودع");
      qty = Number(qty);
      if (!qty || qty <= 0) throw new Error("الكمية يجب أن تكون أكبر من صفر");

      const srcSnap = await getDocs(itemsCol(fromWhId));
      let srcDoc = null;
      const target = itemName.trim().toLowerCase();
      srcSnap.forEach(d => {
        if ((d.data().name || "").trim().toLowerCase() === target) srcDoc = { id: d.id, ...d.data() };
      });
      if (!srcDoc) throw new Error("الصنف غير موجود في المصدر");
      if (Number(srcDoc.quantity) < qty) throw new Error(`الكمية غير كافية (متوفر: ${srcDoc.quantity})`);

      const dstSnap = await getDocs(itemsCol(toWhId));
      let dstDoc = null;
      dstSnap.forEach(d => {
        if ((d.data().name || "").trim().toLowerCase() === target) dstDoc = { id: d.id, ...d.data() };
      });

      const srcRef = doc(db, "users", currentUser.uid, "warehouses", fromWhId, "items", srcDoc.id);
      const dstRef = dstDoc ? doc(db, "users", currentUser.uid, "warehouses", toWhId, "items", dstDoc.id) : null;
      const dstNewRef = !dstDoc ? doc(itemsCol(toWhId)) : null;

      await runTransaction(db, async (tx) => {
        const s = await tx.get(srcRef);
        const cur = Number(s.data().quantity) || 0;
        if (cur < qty) throw new Error("الكمية تغيّرت، أعد المحاولة");
        tx.update(srcRef, { quantity: cur - qty, updatedAt: serverTimestamp() });
        if (dstRef) {
          const d = await tx.get(dstRef);
          tx.update(dstRef, { quantity: (Number(d.data().quantity) || 0) + qty, updatedAt: serverTimestamp() });
        } else {
          tx.set(dstNewRef, {
            name: srcDoc.name, price: srcDoc.price, quantity: qty,
            description: srcDoc.description || "", imageUrl: srcDoc.imageUrl || "",
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
        }
      });
      await addLog("نقل بضاعة", `${qty} من "${itemName}"`);
    }

        const price = priceRaw === "" ? null : Number(priceRaw);

        if (price !== null && (isNaN(price) || price < 0)) return showToast("السعر غير صحيح", "error");

              <div class="searchable">
                <input id="item-search" class="form-control searchable-input" placeholder="اختر المصدر أولاً" disabled />
                <div id="item-list" class="searchable-list"></div>
              </div>
            </div>

            <div class="form-group">
              <label>3. الكمية <span class="req">*</span></label>
              <input id="tr-qty" type="number" min="1" step="1" class="form-control" placeholder="مثال: 10" />
            </div>

            <div class="form-group">
              <label>4. المستودع المستلم <span class="req">*</span></label>
              <div class="searchable">
                <input id="to-wh-search" class="form-control searchable-input" placeholder="ابحث باسم المستودع..." />
                <div id="to-wh-list" class="searchable-list"></div>
              </div>
            </div>

            <button id="tr-btn" class="btn btn-primary" style="width:100%">تنفيذ النقل</button>
          </div>`;

        // Setup: From warehouse searchable
        setupWarehouseSearch("from-wh-search", "from-wh-list", (wh) => {
          transferState.fromWhId = wh ? wh.id : null;
          transferState.itemName = null;
          $("#item-search").value = "";
          $("#item-search").disabled = !wh;
          loadItemsForSource(wh);
        });

        // Setup: To warehouse searchable
        setupWarehouseSearch("to-wh-search", "to-wh-list", (wh) => {
          transferState.toWhId = wh ? wh.id : null;
        });

        $("#tr-btn").onclick = async () => {
          const qty = $("#tr-qty").value.trim();
          if (!transferState.fromWhId) return showToast("اختر المستودع المصدر", "error");
          if (!transferState.itemName) return showToast("اختر الصنف", "error");
          if (!qty || Number(qty) <= 0) return showToast("أدخل كمية صحيحة", "error");
          if (!transferState.toWhId) return showToast("اختر المستودع المستلم", "error");
          if (transferState.fromWhId === transferState.toWhId) return showToast("لا يمكن النقل لنفس المستودع", "error");

          const btn = $("#tr-btn");
          try {
            setLoading(btn, true, "جارٍ النقل...");
            await transferStock({
              fromWhId: transferState.fromWhId,
              toWhId: transferState.toWhId,
              itemName: transferState.itemName,
              qty
            });
            showToast("تم النقل بنجاح", "success");
            renderTransfer();
          } catch (e) {
            showToast("فشل: " + e.message, "error");
            setLoading(btn, false);
          }
        };
      } catch (e) {
        page.innerHTML = `<div class="empty-state">خطأ: ${e.message}</div>`;
      }
    }

    function setupWarehouseSearch(inputId, listId, onSelect) {
      const input = $("#" + inputId);
      const list = $("#" + listId);
      if (!input || !list) return;

      const render = (filterText = "") => {
        const filtered = transferState.warehouses.filter(w =>
          w.name.toLowerCase().includes(filterText.toLowerCase())
        );
        list.innerHTML = filtered.length
          ? filtered.map(w => `<div class="searchable-item" data-id="${w.id}">${w.name}</div>`).join("")
          : `<div class="searchable-item" style="cursor:default;color:var(--muted)">لا نتائج</div>`;
        list.classList.add("open");

        list.querySelectorAll(".searchable-item[data-id]").forEach(item => {
          item.onclick = () => {
            const wh = transferState.warehouses.find(w => w.id === item.dataset.id);
            input.value = wh.name;
            list.classList.remove("open");
            onSelect(wh);
          };
        });
      };

      input.addEventListener("focus", () => render(input.value));
      input.addEventListener("input", () => {
        render(input.value);
        onSelect(null);
      });
      input.addEventListener("blur", () => setTimeout(() => list.classList.remove("open"), 200));
    }

    async function loadItemsForSource(wh) {
      const itemInput = $("#item-search");
      const itemList = $("#item-list");
      if (!wh) {
        itemInput.value = "";
        itemInput.disabled = true;
        itemInput.placeholder = "اختر المصدر أولاً";
        itemList.innerHTML = "";
        return;
      }
      itemInput.disabled = false;
      itemInput.placeholder = "ابحث باسم الصنف...";
      try {
        transferState.items = await getItems(wh.id);
        const available = transferState.items.filter(i => Number(i.quantity) > 0);
        renderItemList(available);
      } catch (e) {
        showToast("فشل تحميل الأصناف: " + e.message, "error");
      }
    }

    function renderItemList(items) {
      const itemInput = $("#item-search");
      const itemList = $("#item-list");
      const term = itemInput.value.trim().toLowerCase();
      const filtered = items.filter(i => i.name.toLowerCase().includes(term));

      itemList.innerHTML = filtered.length
        ? filtered.map(i => `
            <div class="searchable-item" data-name="${i.name}">
              ${i.name}
              <div class="meta">المتوفر: ${i.quantity}</div>
            </div>`).join("")
        : `<div class="searchable-item" style="cursor:default;color:var(--muted)">لا نتائج</div>`;
      itemList.classList.add("open");

      itemList.querySelectorAll(".searchable-item[data-name]").forEach(el => {
        el.onclick = () => {
          transferState.itemName = el.dataset.name;
          itemInput.value = el.dataset.name;
          itemList.classList.remove("open");
        };
      });
    }

    // Attach item search listeners once
    document.addEventListener("input", (e) => {
      if (e.target.id === "item-search" && transferState.fromWhId) {
        const available = transferState.items.filter(i => Number(i.quantity) > 0);
        renderItemList(available);
      }
    });
    document.addEventListener("focusin", (e) => {
      if (e.target.id === "item-search" && transferState.fromWhId) {
        const available = transferState.items.filter(i => Number(i.quantity) > 0);
        renderItemList(available);
      }
    });
    document.addEventListener("focusout", (e) => {
      if (e.target.id === "item-search") {
        setTimeout(() => $("#item-list")?.classList.remove("open"), 200);
      }
    });

    // ============================================
    // Logs Page
    // ============================================
    async function renderLogs() {
      const page = $("#page-logs");
      page.innerHTML = `<div class="empty-state"><div class="icon">⏳</div>جارٍ التحميل...</div>`;
      try {
        const logs = await getLogs();
        page.innerHTML = `
          <div class="section-card">
            <h3>📋 سجل العمليات (${logs.length})</h3>
            ${logs.length ? `
              <div style="overflow-x:auto">
                <table class="table">
                  <thead><tr>
                    <th>العملية</th><th>التفاصيل</th><th>التاريخ والوقت</th>
                  </tr></thead>
                  <tbody>
                    ${logs.map(l => `<tr>
                      <td><b>${l.action}</b></td>
                      <td>${l.details}</td>
                      <td>${fmtDate(l.createdAt)}</td>
                    </tr>`).join("")}
                  </tbody>
                </table>
              </div>` : `<div class="empty-state">لا توجد عمليات بعد</div>`}
          </div>`;
      } catch (e) {
        page.innerHTML = `<div class="empty-state">خطأ: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
